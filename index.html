<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy National Girlfriend Day ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at center, #35152d 0%, #120914 45%, #050307 100%);
    font-family:Arial, sans-serif;
    color:white;
}

/* Falling Petals */

#petals{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.petal{
    position:absolute;
    top:-40px;
    font-size:22px;
    opacity:.8;
    animation:fall linear forwards;
}

@keyframes fall{

    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }

}

</style>

</head>

<body>
<div id="petals"></div>
<!-- YAHAN FLOWER ANIMATION AAYEGI -->

<script>

const petals = document.getElementById("petals");

function createPetal(){

    const petal = document.createElement("div");

    petal.className = "petal";

    petal.innerHTML = "🌸";

    petal.style.left = Math.random() * 100 + "vw";

    petal.style.fontSize =
        (15 + Math.random() * 15) + "px";

    petal.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    petals.appendChild(petal);

    setTimeout(function(){
        petal.remove();
    },10000);
}

setInterval(createPetal,500);
</script>

</body>

</html>
