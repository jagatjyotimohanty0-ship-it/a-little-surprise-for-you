<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy National Girlfriend Day ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at center, #35152d 0%, #120914 45%, #050307 100%);
    font-family:Arial, sans-serif;
    color:white;
}

/* Falling Petals */

#petals{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.petal{
    position:absolute;
    top:-40px;
    font-size:22px;
    opacity:.8;
    animation:fall linear forwards;
}

@keyframes fall{

    0%{
        transform:translateY(-50px) rotate(0deg);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }

}
/* FLOWER SCENE */

#flowerScene{
    position:fixed;
    inset:0;
    z-index:4;
    display:none;
    justify-content:center;
    align-items:flex-end;
    padding-bottom:12vh;
}

#plant{
    position:relative;
    width:220px;
    height:500px;
}

/* Stem */

#stem{
    position:absolute;
    bottom:0;
    left:50%;
    width:8px;
    height:0;
    transform:translateX(-50%);
    border-radius:20px;
    background:linear-gradient(to right,#315c36,#78b85c);
    box-shadow:0 0 12px rgba(100,200,100,.3);

    transition:height 4s ease;
}

/* Leaves */

.leaf{
    position:absolute;
    width:70px;
    height:35px;
    background:linear-gradient(135deg,#7fcf6b,#285d36);
    opacity:0;
    box-shadow:0 0 12px rgba(100,220,120,.3);
}

.leaf-left{
    left:45px;
    bottom:180px;
    border-radius:100% 0 100% 0;
    transform:rotate(-25deg) scale(0);
    transform-origin:right center;
}

.leaf-right{
    right:45px;
    bottom:240px;
    border-radius:0 100% 0 100%;
    transform:rotate(25deg) scale(0);
    transform-origin:left center;
}

/* Grow animations */

.stem-grow{
    height:330px !important;
}

.leaf-left-grow{
    opacity:1;
    animation:leafLeftGrow 1.5s ease forwards;
}

.leaf-right-grow{
    opacity:1;
    animation:leafRightGrow 1.5s ease forwards;
}

@keyframes leafLeftGrow{

    from{
        transform:rotate(-25deg) scale(0);
    }

    to{
        transform:rotate(-25deg) scale(1);
    }

}

@keyframes leafRightGrow{

    from{
        transform:rotate(25deg) scale(0);
    }

    to{
        transform:rotate(25deg) scale(1);
    }

}
#intro{
    position:relative;
    z-index:5;
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
}

.intro-content{
    max-width:650px;
    animation:introAppear 2s ease forwards;
}

.small-text{
    font-size:18px;
    letter-spacing:3px;
    margin-bottom:20px;
    opacity:.8;
}

.intro-content h1{
    font-size:clamp(38px,8vw,75px);
    line-height:1.1;
    margin-bottom:25px;
    text-shadow:
        0 0 10px rgba(255,150,210,.5),
        0 0 30px rgba(255,100,180,.3);
}

.sub-text{
    font-size:19px;
    line-height:1.6;
    margin-bottom:35px;
    opacity:.85;
}

#startFlower{
    padding:16px 35px;
    border:none;
    border-radius:50px;
    font-size:18px;
    color:white;
    background:linear-gradient(135deg,#ff4f9a,#d82f78);
    box-shadow:
        0 0 15px rgba(255,80,160,.5),
        0 0 35px rgba(255,80,160,.2);
    cursor:pointer;
    transition:.3s;
}

#startFlower:hover{
    transform:scale(1.08);
    box-shadow:
        0 0 20px rgba(255,100,180,.8),
        0 0 50px rgba(255,100,180,.4);
}

@keyframes introAppear{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
/* FLOWER BUD */

#flowerBud{
    position:absolute;
    left:50%;
    bottom:325px;

    width:80px;
    height:90px;

    transform:translateX(-50%) scale(0);
    opacity:0;

    transform-origin:bottom center;

    transition:
        transform 1.5s ease,
        opacity 1s ease;

    z-index:5;
}

.bud-show{
    opacity:1 !important;
    transform:translateX(-50%) scale(1) !important;
}

.bud-petal{
    position:absolute;

    width:45px;
    height:65px;

    background:linear-gradient(
        135deg,
        #ff6fae,
        #d92f75
    );

    border-radius:50% 50% 45% 45%;

    box-shadow:
        0 0 15px rgba(255,100,180,.5);
}

.bud-petal-1{
    left:18px;
    top:10px;
    transform:rotate(-15deg);
}

.bud-petal-2{
    left:5px;
    top:20px;
    transform:rotate(-35deg);
}

.bud-petal-3{
    right:5px;
    top:20px;
    transform:rotate(35deg);
}

.bud-center{
    position:absolute;

    width:25px;
    height:25px;

    left:27px;
    top:35px;

    border-radius:50%;

    background:#ffd45c;

    box-shadow:
        0 0 15px #ffd45c;
}
</style>
</head>

<body>
<div id="petals"></div>
<div id="intro">

    <div class="intro-content">

        <p class="small-text">
            For Someone Very Special ❤️
        </p>

        <h1>
            I Made Something Special<br>
            For You
        </h1>

        <p class="sub-text">
            Baby, this little surprise is just for you... 🌸
        </p>

        <button id="startFlower">
            🌱 Click Me
        </button>

    </div>

</div>
<div id="flowerScene">

    <div id="plant">

        <div id="stem"></div>

        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
<div id="flowerBud">

    <div class="bud-petal bud-petal-1"></div>
    <div class="bud-petal bud-petal-2"></div>
    <div class="bud-petal bud-petal-3"></div>

    <div class="bud-center"></div>

</div>
    </div>

</div>
<script>

const petals = document.getElementById("petals");

function createPetal(){

    const petal = document.createElement("div");

    petal.className = "petal";

    petal.innerHTML = "🌸";

    petal.style.left = Math.random() * 100 + "vw";

    petal.style.fontSize =
        (15 + Math.random() * 15) + "px";

    petal.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    petals.appendChild(petal);

    setTimeout(function(){
        petal.remove();
    },10000);
}

setInterval(createPetal,500);
const startFlower = document.getElementById("startFlower");

const intro = document.getElementById("intro");
const flowerScene = document.getElementById("flowerScene");

const stem = document.getElementById("stem");

const leftLeaf = document.querySelector(".leaf-left");
const rightLeaf = document.querySelector(".leaf-right");


startFlower.onclick = function(){

    intro.style.display = "none";

    flowerScene.style.display = "flex";

    setTimeout(function(){

        stem.classList.add("stem-grow");

    },500);


    setTimeout(function(){

        leftLeaf.classList.add("leaf-left-grow");

    },2500);


    setTimeout(function(){

        rightLeaf.classList.add("leaf-right-grow");

    },3200);
setTimeout(function(){

    document.getElementById("flowerBud")
        .classList.add("bud-show");

},4300);
};
</script>

</body>

</html>
